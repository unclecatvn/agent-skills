<!doctype html>
<!-- The Agent Skills intro: a tech product film rendered frame by frame by render.py (no screen recording). Dark UI,
     a HUD, diagrams, a trace graph, a pipeline and charts, cut to a 120 BPM score built on contrast (score.mjs: drops,
     a break, a build, beats of silence, a tape stop; cues in window.MUSIC). The picture hits with it: slammed words,
     a camera that punches on the kick and shakes on the hits, colour that follows the mood.
     Every odoo_trace line is the helper's output on Odoo 18.0 source; every number is from the README's benchmark.
       0–4      the hook: "Your AI just invented a field."
       4–12     an AI types Odoo code: looks right; two invented symbols flagged; "from memory"; the screen collapses
       12–20    drop 1: particles into the mark, Agent Skills, Odoo 16 · 17 · 18 · 19
       20–36    01 architecture: the agent, the plugin, your source; packets on the wires
       36–48    02 runtime (the break): release.py read, the 18.0 pack loaded; "TRACE IT."
       48–72    03 trace (drop 2): access_url FOUND via portal.mixin; silence; "NOT FOUND." (half time); commitment_date
       72–84    04 context brief: "NO FILE:LINE, NO CODE."; every row cited; the gate opens
       84–96    05 definition of done (the build): a pipeline, a montage of checks, silence
       96–112   06 benchmarks (drop 3): "34/34", three charts; a tape stop
       112–128  install
     Times are in beats (120 BPM); every frame is a pure function of t: window.renderAt(t). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Skills · intro</title>
<style>
  :root { --bg: #05060b; --fg: #eef0f6; --mut: #8b91a5; --dim: #4b5063; --line: rgba(255, 255, 255, .09);
    --teal: #2dd4bf; --violet: #a78bfa; --pink: #e879f9; --red: #fb7185; --green: #4ade80; --amber: #fbbf24;
    --grad: linear-gradient(100deg, #2dd4bf, #a78bfa 55%, #e879f9);
    --sans: -apple-system, 'SF Pro Display', system-ui, sans-serif; --mono: ui-monospace, 'SF Mono', Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; overflow: hidden; }
  #film { position: absolute; inset: 0; overflow: hidden; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .set { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .abs { position: absolute; }
  .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mono { font-family: var(--mono); }

  /* the HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; font: 500 16px var(--mono); letter-spacing: .18em; color: var(--mut); }
  .corner { position: absolute; width: 30px; height: 30px; border-color: rgba(255, 255, 255, .28); border-style: solid; }
  #scan { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--teal); box-shadow: 0 0 30px 8px rgba(45, 212, 191, .55), 0 0 120px 30px rgba(167, 139, 250, .3); opacity: 0; }
  #slams { position: absolute; inset: 0; pointer-events: none; }
  .kin { left: 0; right: 0; text-align: center; font: 800 170px/1 var(--sans); letter-spacing: -.05em; white-space: nowrap; }
  .tint { position: absolute; inset: 0; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #e9fffb; opacity: 0; pointer-events: none; }
  #fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; }

  /* the UI kit */
  .panel { position: absolute; border-radius: 18px; background: linear-gradient(180deg, rgba(22, 25, 37, .9), rgba(12, 14, 21, .92)); border: 1px solid var(--line);
    box-shadow: 0 40px 90px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05); overflow: hidden; }
  .phead { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 22px; border-bottom: 1px solid var(--line); font: 600 15px var(--mono); letter-spacing: .16em; color: var(--mut); text-transform: uppercase; }
  .phead i { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 10px; font: 500 21px var(--mono); white-space: nowrap;
    border: 1px solid rgba(45, 212, 191, .35); background: rgba(45, 212, 191, .08); color: #99f6e4; }
  .chip.v { border-color: rgba(167, 139, 250, .4); background: rgba(167, 139, 250, .1); color: #ddd6fe; }
  .chip.r { border-color: rgba(251, 113, 133, .45); background: rgba(251, 113, 133, .1); color: #fecdd3; }
  .chip.gn { border-color: rgba(74, 222, 128, .45); background: rgba(74, 222, 128, .1); color: #bbf7d0; }
  .chip.d { border-color: var(--line); background: rgba(255, 255, 255, .03); color: var(--mut); }
  .lab { font: 600 14px var(--mono); letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
  .sec { position: absolute; left: 120px; top: 104px; }
  .sec .k { font: 600 18px var(--mono); letter-spacing: .2em; color: var(--teal); }
  .sec h2 { margin: 14px 0 0; font: 650 58px/1.08 var(--sans); letter-spacing: -.03em; white-space: nowrap; }
  .sec h2 span { display: inline-block; margin-right: .26em; }
  .code { font: 400 25px/1.75 var(--mono); white-space: pre; color: #c9cede; }
  .kw { color: #c4b5fd; } .st { color: #5eead4; } .fn { color: #f0abfc; } .cm { color: #5b6178; } .nb { color: #fbbf24; }
  .squig { text-decoration: underline wavy rgba(251, 113, 133, var(--p, 0)); text-decoration-thickness: 2px; text-underline-offset: 8px; }
  .node { position: absolute; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; padding: 8px 18px;
    background: rgba(18, 21, 31, .95); border: 1px solid rgba(255, 255, 255, .12); font: 500 21px var(--mono); color: #cfd3e1; white-space: nowrap; }
  .node small { font-size: 15px; color: var(--mut); margin-top: 2px; }
  .bar { height: 30px; border-radius: 8px; transform-origin: 0 50%; }
  .term { position: absolute; border-radius: 18px; background: rgba(8, 9, 14, .94); border: 1px solid var(--line); box-shadow: 0 40px 90px rgba(0, 0, 0, .55); overflow: hidden; }
  .term .body { padding: 22px 30px; font: 400 25px/1.7 var(--mono); white-space: pre; color: #d6dae6; }
  .pr { color: var(--pink); } .ok { color: var(--green); } .bad { color: var(--red); } .mutc { color: var(--mut); }
  .tcaret { display: inline-block; width: .55em; height: 1.05em; margin-left: 2px; vertical-align: -.18em; background: var(--teal); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="film"></div>
<div id="slams"></div>
<div id="hud"></div>
<div id="flash"></div>
<div id="fade"></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, t) => { const k = clamp((t - a) / (b - a)); return k * k * (3 - 2 * k); };
const ease = (k) => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2);
const out = (k) => 1 - (1 - clamp(k)) ** 3;
const out5 = (k) => 1 - (1 - clamp(k)) ** 5;
const inq = (k) => clamp(k) ** 3;
const spring = (u, f = 2, z = .45) => {
  if (u <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u));
};
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- time: beats at 120 BPM; every cue is a sound of score.mjs ----------
const BPM = 120, BEAT = 60 / BPM, B = (b) => b * BEAT;
const SFX = [];
const cue = (b, k, g = 1, p = 0, d = 0) => SFX.push({ t: +B(b).toFixed(4), k, g, p, d });
const typeCues = (text, a, z, step = 3) => { for (let i = 0; i < text.length; i += step) if (text[i] !== ' ') cue(a + (z - a) * i / text.length, 'type', .6, i); };
const typed = (el, text, a, z, b) => { el.textContent = text.slice(0, Math.round(clamp((b - a) / (z - a)) * text.length)); };

function h(tag, a = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v; else n.setAttribute(k, v);
  }
  n.append(...kids.flat().filter((x) => x != null));
  return n;
}
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, a = {}) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) n.setAttribute(k, v); return n; };
/** n popped in u s after its cue: a spring from scale s / offset x, y, a quick fade, a blur clearing. */
function P(n, u, o = {}) {
  if (u < 0) { n.style.opacity = 0; return; }
  const k = spring(u, o.f ?? 2.4, o.z ?? .6);
  n.style.opacity = clamp(u / (o.fade ?? .12));
  n.style.transform = `translate(${(o.x ?? 0) * (1 - k)}px, ${(o.y ?? 0) * (1 - k)}px) scale(${lerp(o.s ?? .9, 1, k)})`;
  const bl = (1 - clamp(u / .25)) * (o.b ?? 6);
  n.style.filter = bl > .2 ? `blur(${bl}px)` : '';
}
const RISE = { s: 1, y: 30, f: 2.2, z: .7 };
const camera = (keys) => (b) => {
  const i = Math.max(0, keys.findLastIndex((k) => k[0] <= b)), a = keys[i], c = keys[i + 1] ?? a;
  const k = c === a ? 0 : ease((b - a[0]) / (c[0] - a[0]));
  return [1, 2, 3].map((j) => lerp(a[j], c[j], k));
};
const view = (set, [x, y, s]) => { set.style.transform = `translate(960px, 540px) scale(${s}) translate(${-x}px, ${-y}px)`; };
const FLASH = [[0, .4, .22], [12, .55, .28], [46.5, .3, .22], [60.4, .5, .22], [96, .5, .22], [112, .35, .3],
  ...[92, 92.5, 93, 93.5, 94, 94.5, 95].map((x) => [x, .18, .14])];
// the hits: the camera punches in, the colours split, the frame shakes on the biggest
const HITS = [[0, 1], [1, .8], [12, 1], [46.5, .8], [48, .6], [60.4, 1.4], [72, .8], [96, 1.4], [112, .9]];
const hitAt = (b) => HITS.reduce((m, [e, g]) => Math.max(m, b >= e ? g * Math.exp(-(b - e) / .35) : 0), 0);
const STOPS = [[11.5, 12], [59.5, 60.4], [95.5, 96], [111, 112]];
const flashAt = (b) => Math.max(0, ...FLASH.map(([e, g, d]) => (b >= e ? g * Math.exp(-(b - e) / d) : 0)));
/** The kick, as the score plays it: four on the floor, half time after NOT FOUND, eighths in the build, none in the break. */
const pulse = (b) => {
  if (STOPS.some(([x, y]) => b >= x && b < y) || (b >= 36 && b < 48) || b >= 120 || b < 4) return 0;
  if (b >= 60.4 && b < 72) { const p = (b - 60.4) % 4; return Math.max(Math.exp(-p / .14), p >= 1.5 ? Math.exp(-(p - 1.5) / .14) : 0); }
  if (b >= 92 && b < 96) return Math.exp(-(b % .5) / .1);
  return (b < 12 ? .5 : 1) * Math.exp(-(b % 1) / .14);
};

// ---------- the stage: a deep background, two glows drifting, a dot grid; a floor grid for the reveal and the end ----------
const glowA = h('div', { class: 'abs', style: 'width: 1300px; height: 1300px; margin: -650px; border-radius: 50%; background: radial-gradient(closest-side, rgba(45, 212, 191, .16), transparent)' });
const glowB = h('div', { class: 'abs', style: 'width: 1400px; height: 1400px; margin: -700px; border-radius: 50%; background: radial-gradient(closest-side, rgba(167, 139, 250, .16), transparent)' });
const dots = h('div', { class: 'abs', style: 'inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .09) 1.2px, transparent 1.4px); background-size: 32px 32px; -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 30%, transparent 85%)' });
const floor = h('div', { class: 'abs', style: 'left: -50%; right: -50%; top: 620px; height: 1100px; transform-origin: 50% 0; transform: perspective(700px) rotateX(70deg); background-image: linear-gradient(rgba(45, 212, 191, .35) 2px, transparent 2px), linear-gradient(90deg, rgba(167, 139, 250, .3) 2px, transparent 2px); background-size: 120px 120px; -webkit-mask-image: linear-gradient(transparent, #000 20%, #000 55%, transparent)' });
const TINTS = { red: 'rgba(251, 113, 133, .22)', teal: 'rgba(45, 212, 191, .16)', violet: 'rgba(167, 139, 250, .2)', pink: 'rgba(232, 121, 249, .2)', blue: 'rgba(96, 165, 250, .12)' };
const tints = Object.fromEntries(Object.entries(TINTS).map(([k, c]) => [k, h('div', { class: 'tint', style: `background: radial-gradient(ellipse 80% 75% at 50% 55%, ${c}, transparent 75%)` })]));
const MOOD = [[0, 'red'], [4, null], [12, 'teal'], [36, 'blue'], [48, 'violet'], [60.4, 'red'], [72, 'teal'], [84, 'violet'], [96, 'pink'], [108, null], [112, 'teal']];
$('#bg').append(glowA, glowB, ...Object.values(tints), dots, floor);

// ---------- the HUD: corners, the brand, the chapter, a timecode and the film's progress ----------
const hud = $('#hud');
for (const [x, y, bw] of [['left: 36px', 'top: 36px', '2px 0 0 2px'], ['right: 36px', 'top: 36px', '2px 2px 0 0'], ['left: 36px', 'bottom: 36px', '0 0 2px 2px'], ['right: 36px', 'bottom: 36px', '0 2px 2px 0']])
  hud.append(h('div', { class: 'corner', style: `${x}; ${y}; border-width: ${bw}` }));
const brand = h('div', { class: 'abs', style: 'left: 84px; top: 46px', text: '◆ AGENT SKILLS · ODOO' });
const chapter = h('div', { class: 'abs', style: 'right: 84px; top: 46px; color: var(--teal)' });
const tc = h('div', { class: 'abs', style: 'left: 84px; bottom: 44px' });
const track = h('div', { class: 'abs', style: 'left: 260px; right: 84px; bottom: 52px; height: 2px; background: rgba(255, 255, 255, .1)' });
const prog = h('div', { class: 'abs', style: 'left: 0; top: 0; height: 2px; background: var(--grad); box-shadow: 0 0 10px rgba(45, 212, 191, .6)' });
track.append(prog);
const scanLine = h('div', { id: 'scan' });
hud.append(brand, chapter, tc, track, scanLine);
const CHAPTERS = [[20, '01 / ARCHITECTURE'], [36, '02 / RUNTIME'], [48, '03 / TRACE'], [72, '04 / CONTEXT BRIEF'], [84, '05 / DEFINITION OF DONE'], [96, '06 / BENCHMARKS'], [112, 'INSTALL']];
const DURATION = B(128);
for (const [b] of CHAPTERS) track.append(h('i', { class: 'abs', style: `left: ${100 * B(b) / DURATION}%; top: -5px; width: 2px; height: 12px; background: rgba(255, 255, 255, .3)` }));

// ---------- shots: [b0, b1) in beats; each but the first two wipes in behind a scan line ----------
const shots = [];
function shot(b0, b1, build, wipe = true) {
  const root = h('div', { class: 'shot' }), set = h('div', { class: 'set' });
  root.append(set);
  $('#film').append(root);
  const s = { b0, b1, root, set, wipe };
  s.render = build(set, s);
  shots.push(s);
  return s;
}
/** A chapter's title: its key and its words, in from below. */
function title(set, key, text) {
  const words = text.split(' ').map((w) => h('span', { text: w }));
  const k = h('div', { class: 'k', text: key }), n = h('div', { class: 'sec' }, k, h('h2', {}, ...words));
  set.append(n);
  return (b, a) => { P(k, B(b - a), RISE); words.forEach((w, i) => P(w, B(b - a - .2 - i * .08), { ...RISE, y: 50 })); };
}
const panel = (x, y, w, hh, head, ...kids) => h('div', { class: 'panel', style: `left: ${x}px; top: ${y}px; width: ${w}px; height: ${hh}px` }, head ? h('div', { class: 'phead' }, h('i'), head) : null, ...kids);
const chip = (text, cls = '', style = '') => h('span', { class: `chip ${cls}`, style, text });
const LAYERS = (stroke, w = 9, fill = 'none') => `<svg viewBox="0 0 128 128" width="100%" height="100%" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M64 22 L106 45 L64 68 L22 45 Z"/><path pathLength="1" d="M24 66 L64 88 L104 66"/><path pathLength="1" d="M24 86 L64 108 L104 86"/></svg>`;

// =====================================================================================================================
// 0–4: the hook, slammed on the first two beats
shot(0, 4.3, (set, s) => {
  const l1 = h('div', { class: 'abs kin', style: 'top: 300px', text: 'Your AI just' });
  const inv = h('span', { class: 'bad', text: 'invented' });
  const l2 = h('div', { class: 'abs kin', style: 'top: 490px' }, inv, ' a field.');
  const sub = h('div', { class: 'abs', style: 'left: 0; right: 0; top: 720px; text-align: center; font: 500 32px var(--mono); color: var(--mut)', html: 'sale.order.<span class="bad">delivery_date</span> · not in the Odoo 18 source' });
  set.append(l1, l2, sub);
  cue(.05, 'glitch', 1); cue(1, 'thud', 1.2); cue(1.05, 'glitch', 1); cue(2, 'type', .5); cue(3.6, 'whoosh', 1.2);
  return (b) => {
    const T = B(b);
    P(l1, B(b), { s: 1.6, f: 2.8, z: .55, b: 16 });
    P(l2, B(b - 1), { s: 1.7, f: 2.8, z: .5, b: 16 });
    P(sub, B(b - 2), RISE);
    const jit = b > 1 && b < 2.4 && rnd(Math.floor(T * 24)) > .45;
    inv.style.textShadow = jit ? `${-12 * rnd(Math.floor(T * 30))}px 0 #22d3ee, ${12 * rnd(Math.floor(T * 30) + 1)}px 0 #f43f5e` : '0 0 60px rgba(251, 113, 133, .5)';
    const e = inq((b - 3.6) / .7);
    set.style.transform = `translate(960px, 540px) scale(${1 + 1.5 * e}) translate(-960px, -540px)`;
    set.style.filter = e > .02 ? `blur(${e * 24}px)` : '';
    set.style.opacity = 1 - e;
  };
}, false);

// 4–12: an AI types Odoo code: it looks right; two symbols it invented are flagged; "from memory"; the screen collapses
shot(4, 12, (set, s) => {
  const L = [
    [['class ', 'kw'], ['SaleOrder', 'fn'], ['(models.Model):', '']],
    [['    _inherit = ', ''], ["'sale.order'", 'st']],
    [['', '']],
    [['    def ', 'kw'], ['action_confirm', 'fn'], ['(self):', '']],
    [['        if not ', 'kw'], ['self.env.user.has_group(', ''], ["'sales_team.group_sale_admin'", 'st squig x1'], [')', '']],
    [['            raise ', 'kw'], ['UserError(', ''], ['"Managers only."', 'st'], [')', '']],
    [['        res = ', ''], ['super', 'kw'], ['().action_confirm()', '']],
    [['        self.', ''], ['delivery_date', 'squig x2'], [' = fields.Datetime.now()', '']],
    [['        return ', 'kw'], ['res', '']],
  ];
  const segs = [];
  const lines = L.map((line) => h('div', { style: 'min-height: 44px' }, ...line.map(([t, c]) => { const n = h('span', { class: c }); segs.push({ t, n }); return n; })));
  const LEN = segs.reduce((a, x) => a + x.t.length, 0);
  const caret = h('i', { class: 'tcaret' });
  const ai = chip('AI · generating', 'v', 'font-size: 16px; padding: 4px 12px');
  const ed = panel(120, 230, 1010, 620, 'sale_order.py', h('div', { class: 'code', style: 'padding: 22px 34px; font-size: 22px' }, ...lines));
  ed.querySelector('.phead').append(h('span', { style: 'flex: 1' }), ai);
  const prob = (l, sym, what) => h('div', { style: 'display: flex; gap: 16px; align-items: center; height: 40px; font: 400 19px var(--mono); color: #fecdd3' }, h('span', { style: 'color: var(--red); font-weight: 700', text: '✕' }), h('span', { class: 'mutc', text: l }), sym, h('span', { class: 'mutc', text: `· ${what}` }));
  const d1 = prob('L5', "'sales_team.group_sale_admin'", 'xmlid not found'), d2 = prob('L8', 'sale.order.delivery_date', 'field not found');
  ed.append(h('div', { class: 'abs', style: 'left: 0; right: 0; bottom: 0; padding: 10px 30px 14px; border-top: 1px solid var(--line); background: rgba(251, 113, 133, .04)' }, h('div', { class: 'lab', text: 'problems', style: 'margin-bottom: 4px' }), d1, d2));
  const t1 = h('div', { class: 'abs', style: 'left: 1220px; top: 380px; font: 650 80px/1.05 var(--sans); letter-spacing: -.035em; color: #cfd3e1', text: 'Looks right.' });
  const t2 = h('div', { class: 'abs', style: 'left: 1220px; top: 560px; font: 800 104px/1 var(--sans); letter-spacing: -.045em; color: var(--red)', text: 'From memory.' });
  set.append(ed, t1, t2);
  const x1 = ed.querySelector('.x1'), x2 = ed.querySelector('.x2');
  const T0 = 4.3, T1 = 7.4;
  for (let i = 0; i < LEN; i += 6) cue(T0 + (T1 - T0) * i / LEN, 'type', .5, i);
  cue(7.8, 'glitch', 1); cue(8.2, 'glitch', 1); cue(8.6, 'thud', 1.2); cue(11.1, 'zap', 1.3);
  const SCR = '!<>-_\\/[]{}=+*^?#01';
  return (b) => {
    const T = B(b);
    let n = Math.round(clamp((b - T0) / (T1 - T0)) * LEN);
    const scr = clamp((b - 9.4) / 1.6); // the code dissolves into noise
    for (const x of segs) {
      const k = Math.max(0, Math.min(x.t.length, n));
      x.n.textContent = scr > 0 ? [...x.t.slice(0, k)].map((ch, i) => (ch !== ' ' && rnd(i * 7 + x.t.length + Math.floor(T * 20)) < scr ? SCR[Math.floor(rnd(i + Math.floor(T * 30)) * SCR.length)] : ch)).join('') : x.t.slice(0, k);
      n -= x.t.length;
    }

// ---------- the slams: words over the picture, on the hits ----------
const slams = [];

  const ls = lines.map(([html, style = '', at = 0]) => { const n = h('div', { class: 'kin', style: `position: relative; ${style}`, html }); box.append(n); return { n, at }; });
  $('#slams').append(box);
  slams.push({ b0, b1, box, ls });
}

const mont = h('div', { class: 'abs', style: 'inset: 0; display: grid; place-items: center' });

window.renderAt = async (T) => {
  const b = T / BEAT;
  for (const s of shots) {
    const a = s.wipe ? s.b0 - .6 : s.b0, live = b >= a && b < s.b1 + (shots[shots.indexOf(s) + 1]?.wipe ? .3 : 0);
    s.root.style.display = live ? '' : 'none';
    if (!live) continue;
    s.render(b);
    if (s.wipe) { const p = ease((b - a) / .9); s.root.style.clipPath = p < 1 ? `inset(0 ${100 * (1 - p)}% 0 0)` : ''; }
  }
  const w = shots.find((s) => s.wipe && b >= s.b0 - .6 && b < s.b0 + .3);
  scanLine.style.opacity = w ? 1 : 0;
  if (w) { scanLine.style.left = `${1920 * ease((b - w.b0 + .6) / .9)}px`; }
  // the stage
  glowA.style.left = `${400 + 260 * Math.sin(T * .21)}px`; glowA.style.top = `${300 + 160 * Math.cos(T * .17)}px`;
  glowB.style.left = `${1500 + 240 * Math.cos(T * .19)}px`; glowB.style.top = `${780 + 140 * Math.sin(T * .23)}px`;
  dots.style.opacity = .7 + .3 * pulse(b);
  floor.style.opacity = smooth(12, 13, b) * (1 - smooth(19.4, 20, b)) + smooth(112, 113, b);
  floor.style.backgroundPosition = `0 ${(T * 120) % 120}px`;
  // the HUD
  hud.style.opacity = smooth(14, 15, b) * (1 - smooth(126, 127.5, b));
  const ch = CHAPTERS.findLast(([a]) => b >= a);
  chapter.textContent = ch ? ch[1] : '';
  chapter.style.opacity = ch && b - ch[0] < .5 && Math.floor(b * 16) % 2 ? .3 : 1;
  tc.textContent = `${String(Math.floor(T / 60)).padStart(2, '0')}:${(T % 60).toFixed(2).padStart(5, '0')}`;
  prog.style.width = `${100 * T / DURATION}%`;
  // the slams and the montage
  for (const sl of slams) {
    const on = b >= sl.b0 && b < sl.b1 + .3;
    sl.box.style.display = on ? 'flex' : 'none';
    if (!on) continue;
    const gone = smooth(sl.b1, sl.b1 + .3, b);
    sl.box.style.opacity = smooth(sl.b0, sl.b0 + .08, b) * (1 - gone);
    sl.ls.forEach(({ n, at }) => {
      P(n, B(b - sl.b0 - at), { s: at ? .9 : 1.8, f: 2.8, z: .5, b: at ? 4 : 18 });
      if (gone > 0) n.style.transform += ` scale(${1 + .3 * gone})`;
    });
  }
  const mi = Math.floor((b - 92) * 2);
  mont.style.display = b >= 92 && b < 95.5 ? 'grid' : 'none';
  if (b >= 92 && b < 95.5) {
    montText.innerHTML = `${MONT[mi]} <span style="color: var(--green)">✓</span>`;
    mont.style.background = ['rgba(5, 6, 11, .94)', 'rgba(13, 60, 56, .94)', 'rgba(5, 6, 11, .94)', 'rgba(46, 30, 90, .94)'][mi % 4];
    const u = B(b - 92 - mi / 2);
    montText.style.transform = `scale(${lerp(1.25, 1, out(u / .12))})`;
    montText.style.filter = u < .05 ? 'blur(6px)' : '';
  }
  // the mood
  const mood = MOOD.findLast(([x]) => b >= x)?.[1];
  for (const [k, n] of Object.entries(tints)) n.style.opacity = k === mood ? .7 + .3 * pulse(b) : 0;
  // the camera: a punch on every kick, a bigger one on the hits; split colours and a shake on the big ones
  const hit = hitAt(b), kickp = pulse(b);
  const sx = hit > .9 ? (rnd(Math.floor(T * 60)) - .5) * 30 * (hit - .9) : 0, sy = hit > .9 ? (rnd(Math.floor(T * 60) + 7) - .5) * 30 * (hit - .9) : 0;
  const film = $('#film');
  film.style.transform = `translate(${sx}px, ${sy}px) scale(${1 + .012 * kickp + .05 * hit})`;
  film.style.filter = hit > .25 ? `drop-shadow(${9 * hit}px 0 rgba(255, 40, 100, .5)) drop-shadow(${-9 * hit}px 0 rgba(0, 220, 255, .5))` : '';
  // silence: black (the one before NOT FOUND holds the graph, darkened)
  const stop = STOPS.find(([x, y]) => b >= x && b < y);
  $('#flash').style.opacity = clamp(flashAt(b));
  $('#fade').style.opacity = Math.max(smooth(126.6, 128, b), stop ? (stop[0] === 59.5 ? .78 : 1) : 0);
};
