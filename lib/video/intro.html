<!doctype html>
<!-- The Agent Skills intro: a product film rendered frame by frame by render.py (no screen recording). One take with no hard
     cuts and no bouncy springs; the shots change on the bar lines of the score (score.mjs, 96 BPM, a bar = 2.5 s): wide,
     close on a line, across to the plugin's rail, back. The page is drawn still at twice the size; the camera (camAt) and
     the chapter captions (#hud) are applied by render.py afterwards, so text is never re-rasterised while the camera moves.
     Every odoo_trace and grep line is real output on Odoo 18.0 source; every number is from the README.
       0–7.5      "AI writes Odoo code from memory." becomes "from your source."
       7.5–12.5   Agent Skills, a Claude Code plugin for Odoo 16 · 17 · 18 · 19
       12.5–49    the session: "Show the delivery date on the Sales Orders list." The workflow resolves the runtime, loads the
                  18.0 pack, traces (delivery_date NOT FOUND, the music holds its breath; commitment_date FOUND, already in
                  the list, hidden), cites the brief, builds, proves on a scratch database, hands off to review, commits
       49–59.5    under the hood: your agent, the plugin, your source
       59.5–67.5  benchmarks, one at a time
       67.5–80    install
     Times are in seconds; every frame is a pure function of t: window.renderAt(t) draws it and returns the camera and
     whether a caption shows. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Skills · intro</title>
<style>
  :root { --bg: #09090b; --fg: #fafafa; --fg2: #d4d4d8; --mut: #a1a1aa; --dim: #71717a; --faint: #3f3f46; --line: rgba(255, 255, 255, .08);
    --accent: #d8a9cc; --teal: #4fc3c8; --ok: #4ade80; --no: #f87171; --clay: #d97757;
    --grad: linear-gradient(100deg, #4fc3c8, #a9b4f0 50%, #d8a9cc);
    --sans: -apple-system, 'SF Pro Display', system-ui, sans-serif; --mono: 'SF Mono', ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; font-variant-emoji: text; }
  #bg { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  #film, #hud { position: absolute; inset: 0; overflow: hidden; }
  body[data-pass="hud"] #bg, body[data-pass="hud"] #film, body[data-pass="hud"] #vignette, body[data-pass="hud"] #fade { visibility: hidden; }
  body:not([data-pass="hud"]) #hud { visibility: hidden; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .set { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; }
  .center { left: 0; right: 0; text-align: center; white-space: nowrap; }
  .w { display: inline-block; }
  .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mono { font-family: var(--mono); }
  .eyebrow { font: 600 17px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--teal); }
  .lab { font: 600 13px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0, 0, 0, .5)); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  /* windows and cards */
  .win { position: absolute; border-radius: 16px; background: rgba(13, 13, 16, .97); border: 1px solid rgba(255, 255, 255, .1); overflow: hidden;
    box-shadow: 0 60px 140px -30px rgba(0, 0, 0, .85), 0 0 0 1px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06); }
  .chrome { position: relative; height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid rgba(255, 255, 255, .06); background: rgba(255, 255, 255, .025); }
  .chrome i { width: 13px; height: 13px; border-radius: 50%; background: #3a3a41; }
  .chrome span { position: absolute; left: 0; right: 0; text-align: center; font: 500 15px var(--sans); color: var(--dim); }
  .card { position: absolute; border-radius: 18px; background: linear-gradient(180deg, rgba(25, 25, 30, .94), rgba(15, 15, 18, .96)); border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: 0 40px 100px -30px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .05); }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 8px; font: 500 18px var(--mono); white-space: nowrap;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--fg2); }
  .chip.s { border-color: rgba(216, 169, 204, .38); background: rgba(216, 169, 204, .09); color: #efd5e8; }
  .chip.a { border-color: rgba(79, 195, 200, .38); background: rgba(79, 195, 200, .09); color: #bdeaec; }
  .chip.c { border-color: rgba(217, 119, 87, .4); background: rgba(217, 119, 87, .1); color: #f3c3b0; }
  .chip.k { border-color: rgba(74, 222, 128, .4); background: rgba(74, 222, 128, .09); color: #bbf7d0; }

  /* the terminal */
  .term { font: 400 21px/33px var(--mono); color: var(--fg2); white-space: pre; }
  .row { position: relative; }
  .row > .hl { position: absolute; left: -16px; right: -16px; top: 0; bottom: 0; border-radius: 7px; background: rgba(216, 169, 204, .07); border-left: 2px solid var(--accent); opacity: 0; }
  .bul { display: inline-block; width: 1.5em; }
  .tn { font-weight: 700; color: var(--fg); }
  .res { color: var(--mut); }
  .path { color: #c7d2fe; }
  .ok { color: var(--ok); } .no { color: var(--no); } .clay { color: var(--clay); } .dimc { color: var(--dim); }
  .mark-ok { color: #bbf7d0; text-decoration: underline 2px rgba(74, 222, 128, var(--u, 0)); text-underline-offset: 6px; }
  .caret { display: inline-block; width: .58em; height: 1.08em; vertical-align: -.2em; background: var(--fg2); }
  .tbl { display: inline-grid; grid-template-columns: 140px 360px 520px 44px; border: 1px solid var(--faint); border-radius: 8px; overflow: hidden; font-size: 19px; }
  .tbl > span { height: 33px; padding: 0 14px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
  .diff { display: inline-block; border-left: 2px solid rgba(74, 222, 128, .5); font-size: 19px; line-height: 30px; }
  .diff > div { padding: 0 20px 0 12px; background: rgba(74, 222, 128, .07); }

  /* the rail: dots are opaque and never move, so the track only shows between them */
  .step { position: absolute; left: 30px; right: 30px; height: 70px; }
  .dot { position: absolute; left: 0; top: 2px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #3f3f46; display: grid; place-items: center; font: 700 14px/1 var(--sans); color: var(--dim); background: #141417; }
  .ring { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); opacity: 0; }
  .ripple { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--ok); opacity: 0; }
  .sname { position: absolute; left: 48px; top: 0; font: 600 22px/32px var(--sans); color: var(--dim); }
  .sdet { position: absolute; left: 48px; top: 34px; font: 400 16px/22px var(--mono); color: var(--dim); white-space: nowrap; }

  /* the chapter captions, laid over the camera */
  .cap { position: absolute; left: 96px; top: 56px; }
  .cap .k { font: 600 16px var(--mono); letter-spacing: .24em; color: var(--teal); }
  .cap .l { margin-top: 12px; font: 650 50px/1.12 var(--sans); letter-spacing: -.03em; white-space: nowrap; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="film"></div>
<div id="vignette"></div>
<div id="fade"></div>
<div id="hud"></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const expo = (k) => (k = clamp(k), k === 1 ? 1 : 1 - 2 ** (-10 * k));
const io = (k) => (k = clamp(k), k < .5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2);
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- sound cues: every one is a sound of score.mjs ----------
const SFX = [];
const cue = (t, k, g = 1, p = 0) => SFX.push({ t: +t.toFixed(4), k, g, p });

function h(tag, a = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v; else n.setAttribute(k, v);
  }
  n.append(...kids.flat().filter((x) => x != null));
  return n;
}
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, a = {}) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) n.setAttribute(k, v); return n; };
const chip = (text, cls = '', style = '') => h('span', { class: `chip ${cls}`, style, text });
const MARK = (size, id, fill = true) => `<svg viewBox="0 0 128 128" width="${size}" height="${size}" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fc3c8"/><stop offset=".55" stop-color="#a9b4f0"/><stop offset="1" stop-color="#d8a9cc"/></linearGradient></defs><g stroke="url(#${id})"><path pathLength="1" d="M64 22 L106 45 L64 68 L22 45 Z"/><path pathLength="1" d="M24 66 L64 88 L104 66"/><path pathLength="1" d="M24 86 L64 108 L104 86"/></g><path class="fill" d="M64 22 L106 45 L64 68 L22 45 Z" fill="url(#${id})" stroke="none" opacity="${fill ? 1 : 0}"/></svg>`;

/** n fades up from a (s): a short rise, a blur clearing; given z, it drifts up and away from z. Text never scales. */
function F(n, t, a, o = {}) {
  const d = o.d ?? 1, k = expo((t - a) / d), q = o.z == null ? 0 : io((t - o.z) / (o.zd ?? .7));
  const op = clamp((t - a) / (d * .45)) * (1 - q);
  n.style.opacity = op;
  if (op <= 0) return;
  n.style.transform = `translate(${(o.x ?? 0) * (1 - k)}px, ${(o.y ?? 26) * (1 - k) - (o.up ?? 18) * q}px)`;
  const bl = (o.b ?? 10) * (1 - k) + (o.zb ?? 10) * q;
  n.style.filter = bl > .2 ? `blur(${bl}px)` : 'none';
}
/** Key-press times for text typed by a person from a to z: uneven, a little slower after a space. */
function keys(text, a, z, seed = 1) {
  const gaps = [...text].map((c, i) => (.55 + .9 * rnd(i * 3.1 + seed)) * (text[i - 1] === ' ' ? 1.5 : 1));
  const sum = gaps.reduce((x, y) => x + y, 0);
  let acc = 0;
  return gaps.map((g) => (acc += g, a + (z - a) * (acc - g) / sum));
}
const typedAt = (times, t) => times.filter((x) => x <= t).length;
const typeCues = (text, times, g = .7) => times.forEach((x, i) => text[i] !== ' ' && cue(x, 'key', g * (.7 + .3 * rnd(i)), i));

// ---------- the stage: a deep background, two soft lights drifting, a faint grid ----------
const glowA = h('div', { class: 'abs', style: 'width: 1500px; height: 1500px; margin: -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(79, 195, 200, .11), transparent)' });
const glowB = h('div', { class: 'abs', style: 'width: 1600px; height: 1600px; margin: -800px; border-radius: 50%; background: radial-gradient(closest-side, rgba(216, 169, 204, .11), transparent)' });
const grid = h('div', { class: 'abs', style: 'inset: 0; background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, #000 20%, transparent 80%)' });
$('#bg').append(glowA, glowB, grid);

// ---------- shots: each is shown over [t0, t1] and handles its own way in and out ----------
const shots = [];
function shot(t0, t1, build) {
  const root = h('div', { class: 'shot' }), set = h('div', { class: 'set' });
  root.append(set);
  $('#film').append(root);
  const s = { t0, t1, root, set };
  s.render = build(set, s);
  shots.push(s);
  return s;
}
const SESSION = {}; // what the camera needs from the session: where its rows are
const NOW = { cam: [960, 540, 1] }; // the camera of the frame being drawn, for the focus pulls

// =====================================================================================================================
// 0–7.5: "AI writes Odoo code from memory." Behind it, the code an AI typed; the symbol it invented is struck out
shot(0, 7.8, (set) => {
  const CODE = ['class SaleOrder(models.Model):', "    _inherit = 'sale.order'", '', '    def action_confirm(self):', '        res = super().action_confirm()',
    '        self.delivery_date = fields.Datetime.now()', '        return res'];
  const codeLines = CODE.map(() => h('div', { style: 'height: 46px' }));
  const ghost = h('div', { class: 'abs mono', style: 'left: 430px; top: 330px; font-size: 30px; line-height: 46px; white-space: pre; color: #8b8b96; filter: blur(1.5px); -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000 30%, transparent 90%)' }, ...codeLines);
  const BIG = 'font: 650 104px/1.2 var(--sans); letter-spacing: -.045em';
  const words = 'AI writes Odoo code'.split(' ').map((w) => h('span', { class: 'w', text: w }));
  const l1 = h('div', { class: 'abs center', style: `top: 352px; ${BIG}` });
  words.forEach((w, i) => l1.append(w, i < words.length - 1 ? ' ' : ''));
  const mem = h('div', { class: 'abs center', style: `top: 482px; ${BIG}; color: var(--dim)`, text: 'from memory.' });
  const src = h('div', { class: 'abs center', style: `top: 482px; ${BIG}` }, 'from ', h('span', { class: 'g', text: 'your source.' }));
  const line = h('i', { class: 'abs', style: 'left: -6px; right: -6px; top: 52%; height: 3px; border-radius: 2px; background: var(--no); transform-origin: 0 50%' });
  const symName = h('span', { style: 'position: relative; color: var(--mut)' }, 'sale.order.delivery_date', line);
  const sym = h('div', { class: 'abs center mono', style: 'top: 668px; font-size: 30px' }, symName, h('span', { style: 'color: var(--dim)', text: '   not in the Odoo 18 source' }));
  set.append(ghost, l1, mem, src, sym);
  const codeKeys = keys(CODE.join('\n'), .2, 4.2, 9);
  cue(3.4, 'strike', .8); cue(5, 'shimmer', .9); cue(6.9, 'whoosh', .6);
  return (t) => {
    let n = typedAt(codeKeys, t);
    CODE.forEach((l, i) => { codeLines[i].textContent = l.slice(0, Math.max(0, n)); n -= l.length + 1; });
    ghost.style.opacity = .2 * clamp(t / 1.5) * (1 - io((t - 6.6) / .9));
    words.forEach((w, i) => F(w, t, .5 + i * .14, { y: 34, b: 14, z: 6.7, zd: .9, up: 30 }));
    F(mem, t, 1.6, { y: 30, b: 14, z: 4.6, zd: .6, up: 30 });
    F(sym, t, 2.6, { y: 16, z: 4.6, zd: .6 });
    line.style.transform = `scaleX(${expo((t - 3.4) / .9)})`;
    symName.style.color = t > 3.4 ? '#fca5a5' : '';
    F(src, t, 5, { y: 34, b: 14, z: 6.8, zd: .9, up: 30 });
  };
});

// 7.5–12.5: the brand. The mark draws itself; Agent Skills; a Claude Code plugin for Odoo 16 · 17 · 18 · 19
shot(7.2, 13.4, (set) => {
  const glow = h('div', { class: 'abs', style: 'left: 960px; top: 330px; width: 900px; height: 900px; margin: -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(169, 180, 240, .16), transparent)' });
  const mark = h('div', { class: 'abs', style: 'left: 885px; top: 222px; width: 150px; height: 150px', html: MARK(150, 'gm1', false) });
  const name = h('div', { class: 'abs center', style: 'top: 418px; font: 650 128px/1.1 var(--sans); background: linear-gradient(100deg, #fafafa 42%, #ffffff 48%, #d7f3f4 50%, #fafafa 56%) 0 0 / 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent', text: 'Agent Skills' });
  const sub = h('div', { class: 'abs center', style: 'top: 590px; font: 500 36px var(--sans); color: var(--mut); letter-spacing: -.01em' }, 'A ', h('span', { style: 'color: var(--fg)', text: 'Claude Code' }), ' plugin for Odoo development');
  const vers = ['16.0', '17.0', '18.0', '19.0'].map((v) => chip(`odoo-${v}`, 's', 'font-size: 22px; padding: 8px 18px'));
  const row = h('div', { class: 'abs', style: 'left: 0; right: 0; top: 684px; display: flex; justify-content: center; gap: 16px' }, ...vers);
  const group = h('div', { class: 'abs', style: 'inset: 0' }, glow, mark, name, sub, row);
  set.append(group);
  const paths = [...mark.querySelectorAll('g path')], fill = mark.querySelector('.fill');
  paths.forEach((p) => { p.style.strokeDasharray = '1'; });
  cue(7.5, 'bloom'); vers.forEach((_, i) => cue(9.8 + i * .14, 'glass', .5, i));
  return (t) => {
    glow.style.opacity = .6 * clamp((t - 7.3) / 1.2) + .15 * Math.sin(t * 1.3);
    F(mark, t, 7.4, { y: 0, b: 6, d: 1.4 });
    paths.forEach((p, i) => { p.style.strokeDashoffset = `${1 - io((t - 7.5 - i * .18) / 1.1)}`; });
    fill.setAttribute('opacity', `${.95 * io((t - 8.6) / .8)}`);
    F(name, t, 8.3, { y: 20, b: 16, d: 1.4 });
    name.style.letterSpacing = `${lerp(.03, -.045, expo((t - 8.3) / 1.8))}em`;
    name.style.backgroundPosition = `${lerp(100, 0, io((t - 9.2) / 1.4))}% 0`;
    F(sub, t, 9.0);
    vers.forEach((v, i) => F(v, t, 9.8 + i * .14, { y: 18, b: 6 }));
    const q = io((t - 11.6) / 1.2);
    group.style.transform = `translateY(${-90 * q}px)`;
    group.style.opacity = 1 - q;
    group.style.filter = q > .01 ? `blur(${14 * q}px)` : 'none';
  };
});

// 12.5–49: the session. Claude Code on the left, the plugin's rail on the right
const SESSION_IN = 12.5, SESSION_OUT = 48.2, DONE = 45;
shot(SESSION_IN, 49.8, (set) => {
  const TX = 96, TY = 100, TW = 1190, TH = 880, LH = 33, VP = 60, VPH = TH - VP - 168;
  const RX = 1350, RY = 100, RW = 474, RH = 880;
  const rig = h('div', { class: 'abs', style: 'inset: 0; transform-origin: 50% 100%' });
  const stage = h('div', { class: 'abs', style: 'inset: 0; perspective: 2000px; perspective-origin: 50% 20%' }, rig);
  const halo = h('div', { class: 'abs', style: 'left: 690px; top: 540px; width: 1800px; height: 1300px; margin: -650px -900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(169, 180, 240, .09), transparent)' });
  set.append(halo, stage);

  // ---- the window ----
  const win = h('div', { class: 'win', style: `left: ${TX}px; top: ${TY}px; width: ${TW}px; height: ${TH}px` },
    h('div', { class: 'chrome' }, h('i'), h('i'), h('i'), h('span', { text: 'x_sale — claude' })));
  const tx = h('div', { style: 'position: relative' });
  const vp = h('div', { class: 'abs term', style: `left: 30px; right: 30px; top: ${VP}px; height: ${VPH}px; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 56px)` }, tx);
  const glyph = h('span'), verb = h('span', { style: 'background: linear-gradient(90deg, var(--clay) 40%, #ffd6c6 50%, var(--clay) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent' });
  const meta = h('span', { class: 'dimc' });
  const spin = h('div', { class: 'abs term', style: `left: 30px; top: ${TH - 160}px; color: var(--clay)` }, glyph, ' ', verb, ' ', meta);
  const typedEl = h('span', { style: 'color: var(--fg)' }), caret = h('i', { class: 'caret' });
  const input = h('div', { class: 'abs term', style: `left: 22px; right: 22px; top: ${TH - 116}px; height: 60px; padding: 13px 18px; border: 1px solid var(--faint); border-radius: 10px` }, h('span', { class: 'dimc', text: '> ' }), typedEl, caret);
  const hint = h('div', { class: 'abs term', style: `left: 42px; top: ${TH - 50}px; font-size: 17px; color: var(--dim)`, text: '? for shortcuts' });
  win.append(vp, spin, input, hint);

  // ---- the transcript: rows that grow in, the newest kept in view ----
  const R = [];
  const row = (t, kids, o = {}) => {
    const hl = h('i', { class: 'hl' });
    const el = h('div', { class: 'row', style: `height: ${o.h ?? LH}px` }, hl, ...kids);
    tx.append(el);
    const r = { t, el, hl, h: o.h ?? LH, ...o };
    R.push(r);
    return r;
  };
  const gap = (t) => row(t, [], { h: LH * .55 });
  const tool = (t, name, arg, dur, step, o = {}) => {
    const b = h('span', { class: 'bul', text: '●' });
    const r = row(t, [b, h('span', { class: 'tn', text: name }), h('span', { text: `(${arg}${o.more ? '' : ')'}` })], { b, run: [t, t + dur], step, fail: o.fail });
    if (o.more) row(t, [h('span', { text: `     ${o.more})` })]);
    cue(t, 'tool', .6);
    cue(t + dur, o.fail ? 'fail' : 'done', 1, R.length);
    return r;
  };
  const res = (t, html, first = true) => row(t, [h('span', { class: 'res', html: (first ? '  ⎿  ' : '     ') + html })]);
  const say = (t, lines, cps = 85) => {
    let at = t;
    return lines.map((text, i) => {
      const s = h('span', { style: 'color: var(--fg)' });
      const r = row(at, [i ? h('span', { class: 'bul' }) : h('span', { class: 'bul', style: 'color: var(--fg)', text: '●' }), s], { stream: { s, text, cps } });
      at += text.length / cps;
      return r;
    });
  };

  const welcome = h('div', { style: 'display: inline-block; margin-top: 4px; padding: 8px 26px 10px; border: 1px solid var(--clay); border-radius: 9px; line-height: 33px' },

const fit = ([x, y, s]) => { s = Math.max(1, s); return [clamp(x, 960 / s, 1920 - 960 / s), clamp(y, 540 / s, 1080 - 540 / s), s]; };
/** The camera at t: the move into the current key, from wherever the previous key's target is now. */
